# Production Profile Configuration
# Activate with: java -jar mail-system.jar --spring.profiles.active=prod

spring.application.name=mail-system
spring.jpa.open-in-view=false

# ═════════════════════════════════════════════════════════════════════════════
# PostgreSQL Production Database
# ═════════════════════════════════════════════════════════════════════════════
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mailsystem}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:mailsystem_user}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration (Production)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable H2 Console in Production
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# JWT Configuration (Use Environment Variables)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Logging Configuration (Production)
logging.level.de.thm.mni.mailsystem=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN