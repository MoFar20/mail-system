spring.application.name=mail-system
spring.jpa.open-in-view=false

# ═════════════════════════════════════════════════════════════════════════════
# H2 Database Configuration (Development & Testing Only)
# ═════════════════════════════════════════════════════════════════════════════
# WARNING: H2 is an in-memory database suitable for development and testing.
# For PRODUCTION, replace with a persistent database (PostgreSQL, MySQL, etc.)
# ═════════════════════════════════════════════════════════════════════════════

# H2 Database Configuration (file-based for data persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/mailsystem;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Development/Debugging)
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/mailsystem
# WARNING: Disable H2 console in production!
# spring.h2.console.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# JWT Configuration
# JWT secret MUST be overridden via environment variable or external config before deployment.
# Generate with: openssl rand -base64 64
# The default value below is for local development ONLY - never use in production.
jwt.secret=${JWT_SECRET:dev-only-secret-key-minimum-32-chars-long}
jwt.expiration-ms=86400000

# Logging for debugging
logging.level.de.thm.mni.mailsystem=DEBUG
logging.level.org.springframework.security=DEBUG
